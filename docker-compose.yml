services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construction_os}
      POSTGRES_USER: ${POSTGRES_USER:-construction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-construction}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-construction} -d ${POSTGRES_DB:-construction_os}"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-construction}:${POSTGRES_PASSWORD:-construction}@postgres:5432/${POSTGRES_DB:-construction_os}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/var/lib/construction-os/storage}
    working_dir: /app
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - report_storage:/var/lib/construction-os/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-construction}:${POSTGRES_PASSWORD:-construction}@postgres:5432/${POSTGRES_DB:-construction_os}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/var/lib/construction-os/storage}
    working_dir: /app
    command: python -m app.runtime.worker
    volumes:
      - ./apps/api:/app
      - report_storage:/var/lib/construction-os/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    working_dir: /app
    command: >-
      sh -c "npm install --no-audit --no-fund &&
      npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  report_storage:
  web_node_modules:
