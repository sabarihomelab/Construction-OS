name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - run: python -m compileall app migrations
      - run: pytest -q

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './setup.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start complete local stack
        run: |
          if ! docker compose up -d --build; then
            docker compose ps -a
            docker compose logs --tail=200 postgres api web
            exit 1
          fi
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=200 api
          exit 1
      - name: Validate live API readiness and composition
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen("http://localhost:8000/health/ready", timeout=5) as response:
              readiness = json.load(response)
          assert readiness["status"] == "ready"
          expected_modules = {"projects", "documents", "drawings", "rfis", "submittals", "field"}
          assert expected_modules == set(readiness["runtime_modules"])

          with urlopen("http://localhost:8000/openapi.json", timeout=5) as response:
              openapi = json.load(response)
          paths = set(openapi["paths"])
          required_paths = {
              "/api/v1/projects",
              "/api/v1/projects/{project_id}/rfis",
              "/api/v1/projects/{project_id}/submittals",
              "/api/v1/projects/{project_id}/daily-reports",
              "/api/v1/configuration/modules/{module_key}",
          }
          missing = sorted(required_paths - paths)
          assert not missing, f"Missing live API paths: {missing}"
          PY
      - name: Wait for web
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=200 web
          exit 1
      - name: Show local stack status
        run: docker compose ps
      - name: Stop local stack
        if: always()
        run: docker compose down -v --remove-orphans
