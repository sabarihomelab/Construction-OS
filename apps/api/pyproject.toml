[project]
name = "construction-os-api"
version = "0.1.0"
description = "Construction OS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "alembic>=1.16,<2",
  "python-jose[cryptography]>=3.5,<4",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
