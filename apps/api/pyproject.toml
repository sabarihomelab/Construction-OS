[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-os-api"
version = "0.2.0"
description = "Construction OS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"app/db/model_registry.py" = ["RUF022"]
"app/modules/commercial/service.py" = ["FURB157", "I001"]
"app/modules/configuration/registry.py" = ["FURB157"]
"app/modules/scheduling/service.py" = ["SIM102"]
"app/modules/workforce/router.py" = ["I001"]
